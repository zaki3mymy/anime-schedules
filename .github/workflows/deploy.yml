name: Terraform Deployment

on:
  workflow_dispatch:

  pull_request:
    paths:
      - 'src/**'
      - 'tf/**'
      # urllib のレイヤーのバージョン（uv.lock）とビルドのスクリプト
      - 'uv.lock'
      - 'scripts/**'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tf/**'
      # urllib のレイヤーのバージョン（uv.lock）とビルドのスクリプト
      - 'uv.lock'
      - 'scripts/**'

# AWSとOIDC連携するには必要な設定らしい
permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write # plan の結果を PR にコメントするため
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1

      - name: Configure AWS credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
          # AWS のアカウント ID をログでマスクする。terraform の出力の ARN（Refreshing state... [id=arn:aws:...]
          # や plan の差分）にアカウント ID が出るため。公開リポジトリなので Actions のログは誰でも見られる
          mask-aws-account-id: true

      - name: Build the urllib instrumentation layer
        # tf/modules/main.tf の aws_lambda_layer_version.otel_urllib が使う zip（dist/otel-urllib-layer.zip）を作る
        run: python3 scripts/build_otel_urllib_layer.py

      - name: Fetch Terraform variables from Parameter Store
        working-directory: tf
        run: |
          annict_token=$(aws ssm get-parameter --name "/app/anime_schedules/annict_token" --with-decryption --query "Parameter.Value" --output text)
          notify_api_key=$(aws ssm get-parameter --name "/app/anime_schedules/notify_api_key" --with-decryption --query "Parameter.Value" --output text)
          notify_endpoint=$(aws ssm get-parameter --name "/app/anime_schedules/notify_endpoint" --with-decryption --query "Parameter.Value" --output text)
          # SSM から読んだ値は GitHub の Secrets ではないので、自動ではマスクされない。
          # terraform の出力（Lambda の環境変数の差分など）に出ないよう、ログでマスクする
          echo "::add-mask::$annict_token"
          echo "::add-mask::$notify_api_key"
          echo "::add-mask::$notify_endpoint"
          cat <<EOF > terraform.tfvars
          annict_token    = "$annict_token"
          notify_api_key  = "$notify_api_key"
          notify_endpoint = "$notify_endpoint"
          EOF

      - name: Initialize Terraform
        working-directory: tf
        run: terraform init -backend-config="bucket=${{ vars.S3_BUCKET_FOR_STATE }}" -backend-config="key=anime-schedules/terraform.tfstate" -backend-config="region=ap-northeast-1"

      - name: Run Terraform Plan
        id: plan
        working-directory: tf
        # tee でログにも出しつつファイルに保存する（PR にコメントするため）。
        # shell を明示すると pipefail が有効になり、plan の失敗を tee で握りつぶさない
        shell: bash
        run: terraform plan -no-color -var-file=terraform.tfvars -out=tfplan 2>&1 | tee "$RUNNER_TEMP/plan.txt"

      - name: Comment plan result
        # plan が失敗した場合も、エラーの内容を PR に残す
        if: always() && (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_FILE: ${{ runner.temp }}/plan.txt
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          # コメントから消す値（どれもログではマスク済み）
          AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
        with:
          script: |
            const fs = require('fs')
            let plan = fs.existsSync(process.env.PLAN_FILE)
              ? fs.readFileSync(process.env.PLAN_FILE, 'utf8')
              : '(plan の出力がありません)'

            // add-mask はログの表示だけをマスクし、コメントの本文はマスクしない。
            // 公開リポジトリのコメントに出ないよう、アカウント ID と SSM から読んだ値を *** に置き換える
            const secrets = [process.env.AWS_ACCOUNT_ID]
            for (const line of fs.readFileSync('tf/terraform.tfvars', 'utf8').split('\n')) {
              const m = line.match(/^\s*\w+\s*=\s*"(.*)"\s*$/)
              if (m && m[1]) secrets.push(m[1])
            }
            for (const v of secrets.filter((v) => v)) {
              plan = plan.split(v).join('***')
            }

            // 既存リソースの読み込みの行（Refreshing state... [id=...] など）は除き、
            // 変更内容・エラー・警告だけを残す
            const noise = /^\S.*: (Refreshing state\.\.\.|Reading\.\.\.|Read complete after|Preparing import\.\.\.)/
            plan = plan.split('\n').filter((line) => !noise.test(line)).join('\n').trim()

            // PR のコメントは 65,536 文字までなので、長すぎる場合は末尾を残して切り詰める
            const limit = 60000
            if (plan.length > limit) {
              plan = '... (先頭を省略。全文は Actions のログを参照) ...\n' + plan.slice(-limit)
            }

            let body = '## Terraform Plan\n\n'
            if (process.env.PLAN_OUTCOME !== 'success') {
              body += ':x: **plan に失敗しました。**\n\n'
            }
            if (process.env.PLAN_OUTCOME === 'success' && plan.includes('No changes.')) {
              body += 'No changes.'
            } else {
              body += ['<details>', '<summary>Show plan</summary>', '', '```', plan, '```', '', '</details>'].join('\n')
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            })

      - name: Upload Terraform Plan as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan
          path: tf/tfplan

  terraform-apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1

      - name: Configure AWS credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
          # AWS のアカウント ID をログでマスクする。terraform の出力の ARN（Refreshing state... [id=arn:aws:...]
          # や plan の差分）にアカウント ID が出るため。公開リポジトリなので Actions のログは誰でも見られる
          mask-aws-account-id: true

      - name: Build the urllib instrumentation layer
        # tf/modules/main.tf の aws_lambda_layer_version.otel_urllib が使う zip（dist/otel-urllib-layer.zip）を作る
        run: python3 scripts/build_otel_urllib_layer.py

      - name: Fetch Terraform variables from Parameter Store
        working-directory: tf
        run: |
          annict_token=$(aws ssm get-parameter --name "/app/anime_schedules/annict_token" --with-decryption --query "Parameter.Value" --output text)
          notify_api_key=$(aws ssm get-parameter --name "/app/anime_schedules/notify_api_key" --with-decryption --query "Parameter.Value" --output text)
          notify_endpoint=$(aws ssm get-parameter --name "/app/anime_schedules/notify_endpoint" --with-decryption --query "Parameter.Value" --output text)
          # SSM から読んだ値は GitHub の Secrets ではないので、自動ではマスクされない。
          # terraform の出力（Lambda の環境変数の差分など）に出ないよう、ログでマスクする
          echo "::add-mask::$annict_token"
          echo "::add-mask::$notify_api_key"
          echo "::add-mask::$notify_endpoint"
          cat <<EOF > terraform.tfvars
          annict_token    = "$annict_token"
          notify_api_key  = "$notify_api_key"
          notify_endpoint = "$notify_endpoint"
          EOF

      - name: Initialize Terraform
        working-directory: tf
        run: terraform init -backend-config="bucket=${{ vars.S3_BUCKET_FOR_STATE }}" -backend-config="key=anime-schedules/terraform.tfstate" -backend-config="region=ap-northeast-1"

      - name: Apply Terraform Plan
        working-directory: tf
        run: terraform apply -var-file=terraform.tfvars -auto-approve
