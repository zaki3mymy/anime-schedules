name: CI

# AWS の認証情報（シークレット）を使わないジョブだけで構成している。
# Dependabot の PR ではシークレットが渡されないが、この CI はそのまま動く。
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tf/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "Containerfile"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tf/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "Containerfile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (ruff)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # ruff のバージョンは uv.lock（dev グループ）で固定している
      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check --diff src tests

  test:
    runs-on: ubuntu-latest
    name: Unit tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # --locked: pyproject.toml と uv.lock が食い違っていたら失敗させる
      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest

  container:
    runs-on: ubuntu-latest
    name: Build local container
    # 依存パッケージ（uv.lock）はローカル環境用のコンテナイメージにだけ入る
    # （本番の zip には含まれず、OTel は Lambda レイヤーから提供される）。
    # 依存更新でイメージのビルドや OTel の自動計装の起動が壊れていないかを確認する
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -f Containerfile -t anime-schedules:ci .

      - name: Smoke test (import handler via opentelemetry-instrument)
        run: |
          docker run --rm \
            -e OTEL_TRACES_EXPORTER=none \
            -e OTEL_METRICS_EXPORTER=none \
            -e OTEL_LOGS_EXPORTER=none \
            --entrypoint opentelemetry-instrument \
            anime-schedules:ci \
            python -c "import lambda_function; print('handler:', lambda_function.lambda_handler)"

  terraform:
    runs-on: ubuntu-latest
    name: Terraform fmt / validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # deploy.yml と揃える
          terraform_version: 1.5.0

      - name: Terraform fmt
        run: terraform -chdir=tf fmt -check -recursive -diff

      # backend（S3）に接続しないので AWS の認証情報は不要
      - name: Terraform init
        run: terraform -chdir=tf init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=tf validate
