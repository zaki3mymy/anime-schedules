[project]
name = "anime-schedules"
version = "0.1.0"
description = "Notify me of today's anime broadcast schedule by LINE Messaging API"
readme = "README.md"
authors = [
    { name = "zaki3mymy", email = "zaki.last@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "opentelemetry-distro==0.66b1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-aws-lambda==0.66b1",
    "opentelemetry-instrumentation-urllib==0.66b1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.16.9",
]

[tool.uv]
# uv のバージョン。CI（setup-uv）もローカルもこの範囲の uv を使う。
# uv のバージョンが変わると uv.lock の書き方（revision）が変わることがあるため、マイナーバージョンでそろえる。
# 下限は Dependabot が使う uv（今は 0.13.7）も満たすようにする（満たさないと Dependabot の uv の更新が失敗する）。
# 0.14 に上げるときは、Dependabot の uv が 0.14 に対応してから上げる
required-version = ">=0.13,<0.14"

[build-system]
requires = ["uv_build>=0.11.32,<0.14"]
build-backend = "uv_build"
