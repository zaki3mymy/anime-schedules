# Lambda の Collector レイヤー（opentelemetry-lambda のコミュニティ製）の設定。
# アプリ（Python 計装レイヤー）からトレース・メトリクス・ログを OTLP で受けて、Grafana Cloud に otlphttp で送る。
# 送信先と Authorization ヘッダーの値は、Lambda の環境変数で渡す（tf/modules/main.tf）。
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: localhost:4317
      http:
        endpoint: localhost:4318
  # Lambda の Telemetry API から、実行環境の初期化（コールドスタート）の開始と終了を受け取り、
  # "init <関数名>" という span（faas.coldstart=true）を作る。トレースだけで使う
  telemetryapi:

processors:
  # telemetryapi が作った初期化の span を、そのとき呼ばれた実行（ハンドラー）と同じトレースに入れる。
  # 実行の span を faas.invocation_id で見分け、初期化の span を faas.coldstart で見分けるので、
  # アプリの span に faas.coldstart を付けてはいけない（transform/redact でも faas.invocation_id は消さない）
  coldstart:
  # Grafana Cloud に出したくない値を、送る前に消す・伏せる。
  #   - cloud.account.id・cloud.resource_id: Lambda の計装が実行の span に付ける AWS のアカウント ID と関数の ARN
  #   - http.url: urllib の計装（自前のレイヤーで足している。tf/modules/main.tf）が、
  #     呼び出し先の URL をそのまま span とメトリクス（http.client.duration など）に付ける。
  #     通知 API（nandemo-oshirase）の URL には API Gateway のホストが入るので、
  #     span ではホストだけを伏せ（Annict の URL は調べるときに役立つので残す）、
  #     メトリクスでは属性ごと消す（Annict の URL のクエリには日付が入り、系列が毎日増えるため）
  transform/redact:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "cloud.account.id")
          - delete_key(attributes, "cloud.resource_id")
          - replace_pattern(attributes["http.url"], "://[^/]+\\.execute-api\\.[^/]+\\.amazonaws\\.com", "://{nandemo-oshirase}")
      - context: resource
        statements:
          - delete_key(attributes, "cloud.account.id")
          - delete_key(attributes, "cloud.resource_id")
    metric_statements:
      - context: datapoint
        statements:
          - delete_key(attributes, "http.url")
      - context: resource
        statements:
          - delete_key(attributes, "cloud.account.id")
          - delete_key(attributes, "cloud.resource_id")
    # ログの本文は、アプリのまま送るため属性のように消せない。今のアプリのログには入らないが、
    # 例外のメッセージなどに入ったときのために、ARN の中のアカウント ID と API Gateway のホストを伏せる。
    # CloudWatch Logs には元のまま出る。$$ は Collector の設定の $ のエスケープ
    # （"$${1}" は OTTL には "${1}"、つまり 1 番目のキャプチャーとして渡る）
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "(arn:aws[a-z-]*:[a-z0-9-]+:[a-z0-9-]*:)[0-9]{12}", "$${1}***")
          - replace_pattern(body, "[a-z0-9]+\\.execute-api\\.[a-z0-9-]+\\.amazonaws\\.com", "{nandemo-oshirase}")
      - context: resource
        statements:
          - delete_key(attributes, "cloud.account.id")
          - delete_key(attributes, "cloud.resource_id")
  # Lambda の応答を返してから送るようにする（実行の終わりに Grafana Cloud への送信を待たない）。
  # 送り終わるまで実行環境は止められない。パイプラインの最後に置く
  decouple:

exporters:
  otlphttp/grafana_cloud:
    endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:GRAFANA_CLOUD_OTLP_AUTH}

service:
  pipelines:
    traces:
      receivers: [otlp, telemetryapi]
      processors: [coldstart, transform/redact, decouple]
      exporters: [otlphttp/grafana_cloud]
    metrics:
      receivers: [otlp]
      processors: [transform/redact, decouple]
      exporters: [otlphttp/grafana_cloud]
    # アプリの logging のログ（opentelemetry-instrumentation-logging が OTel のログにする）。
    # Grafana Cloud では Loki に入り、トレース ID・span ID でトレースと紐づく
    logs:
      receivers: [otlp]
      processors: [transform/redact, decouple]
      exporters: [otlphttp/grafana_cloud]
