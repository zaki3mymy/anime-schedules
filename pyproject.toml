[project]
name = "anime-schedules"
version = "0.1.0"
description = "Notify me of today's anime broadcast schedule by LINE Messaging API"
readme = "README.md"
authors = [
    { name = "zaki3mymy", email = "zaki.last@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "opentelemetry-distro==0.65b0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-instrumentation-aws-lambda==0.65b0",
    "opentelemetry-instrumentation-urllib==0.65b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.14"]
build-backend = "uv_build"
