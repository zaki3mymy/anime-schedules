name: CI

# AWS の認証情報を使うのは terraform-plan だけ（Dependabot の PR では Dependabot secrets を使う）
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tf/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "Containerfile"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  # main への push では deploy.yml から呼ぶ
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (ruff)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # ruff のバージョンは uv.lock（dev グループ）で固定している
      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check --diff src tests

  test:
    runs-on: ubuntu-latest
    name: Unit tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # --locked: pyproject.toml と uv.lock が食い違っていたら失敗させる
      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest

  container:
    runs-on: ubuntu-latest
    name: Build local container
    # 依存パッケージ（uv.lock）はローカル環境用のコンテナイメージにだけ入る
    # （本番の zip には含まれず、OTel は Lambda レイヤーから提供される）。
    # 依存更新でイメージのビルドや OTel の自動計装の起動が壊れていないかを確認する
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -f Containerfile -t anime-schedules:ci .

      - name: Smoke test (import handler via opentelemetry-instrument)
        run: |
          docker run --rm \
            -e OTEL_TRACES_EXPORTER=none \
            -e OTEL_METRICS_EXPORTER=none \
            -e OTEL_LOGS_EXPORTER=none \
            --entrypoint opentelemetry-instrument \
            anime-schedules:ci \
            python -c "import lambda_function; print('handler:', lambda_function.lambda_handler)"

  terraform:
    runs-on: ubuntu-latest
    name: Terraform fmt / validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # deploy.yml と揃える
          terraform_version: 1.17.1

      - name: Terraform fmt
        run: terraform -chdir=tf fmt -check -recursive -diff

      # backend（S3）に接続しないので AWS の認証情報は不要
      - name: Terraform init
        run: terraform -chdir=tf init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=tf validate

  terraform-plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    needs: terraform
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write # plan の結果を PR にコメントするため
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # deploy.yml と揃える
          terraform_version: 1.17.1

      - name: Configure AWS credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
          # terraform の出力の ARN に出るアカウント ID を、ログでマスクする
          mask-aws-account-id: true

      - name: Build the urllib instrumentation layer
        # tf/modules/main.tf の aws_lambda_layer_version.otel_urllib が使う zip（dist/otel-urllib-layer.zip）を作る
        run: python3 scripts/build_otel_urllib_layer.py

      - name: Fetch Terraform variables from Parameter Store
        working-directory: tf
        run: |
          annict_token=$(aws ssm get-parameter --name "/app/anime_schedules/annict_token" --with-decryption --query "Parameter.Value" --output text)
          notify_api_key=$(aws ssm get-parameter --name "/app/anime_schedules/notify_api_key" --with-decryption --query "Parameter.Value" --output text)
          notify_endpoint=$(aws ssm get-parameter --name "/app/anime_schedules/notify_endpoint" --with-decryption --query "Parameter.Value" --output text)
          # SSM の値は Secrets ではないので自動ではマスクされない
          echo "::add-mask::$annict_token"
          echo "::add-mask::$notify_api_key"
          echo "::add-mask::$notify_endpoint"
          cat <<EOF > terraform.tfvars
          annict_token    = "$annict_token"
          notify_api_key  = "$notify_api_key"
          notify_endpoint = "$notify_endpoint"
          EOF

      - name: Initialize Terraform
        working-directory: tf
        run: terraform init -backend-config="bucket=${{ vars.S3_BUCKET_FOR_STATE }}" -backend-config="key=anime-schedules/terraform.tfstate" -backend-config="region=ap-northeast-1"

      - name: Run Terraform Plan
        id: plan
        working-directory: tf
        # コメント用にファイルにも保存する。shell を明示して pipefail を有効にする
        shell: bash
        run: terraform plan -no-color -var-file=terraform.tfvars 2>&1 | tee "$RUNNER_TEMP/plan.txt"

      - name: Comment plan result
        # plan が失敗した場合も、エラーの内容を PR に残す
        if: always() && (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_FILE: ${{ runner.temp }}/plan.txt
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
        with:
          script: |
            const fs = require('fs')
            let plan = fs.existsSync(process.env.PLAN_FILE)
              ? fs.readFileSync(process.env.PLAN_FILE, 'utf8')
              : '(plan の出力がありません)'

            // add-mask はコメントには効かないので、アカウント ID と SSM の値を *** に置き換える
            const secrets = [process.env.AWS_ACCOUNT_ID]
            for (const line of fs.readFileSync('tf/terraform.tfvars', 'utf8').split('\n')) {
              const m = line.match(/^\s*\w+\s*=\s*"(.*)"\s*$/)
              if (m && m[1]) secrets.push(m[1])
            }
            for (const v of secrets.filter((v) => v)) {
              plan = plan.split(v).join('***')
            }

            // 既存リソースの読み込みの行（Refreshing state... など）を除く
            const noise = /^\S.*: (Refreshing state\.\.\.|Reading\.\.\.|Read complete after|Preparing import\.\.\.)/
            plan = plan.split('\n').filter((line) => !noise.test(line)).join('\n').trim()

            // PR のコメントは 65,536 文字までなので、長すぎる場合は末尾を残して切り詰める
            const limit = 60000
            if (plan.length > limit) {
              plan = '... (先頭を省略。全文は Actions のログを参照) ...\n' + plan.slice(-limit)
            }

            let body = '## Terraform Plan\n\n'
            if (process.env.PLAN_OUTCOME !== 'success') {
              body += ':x: **plan に失敗しました。**\n\n'
            }
            if (process.env.PLAN_OUTCOME === 'success' && plan.includes('No changes.')) {
              body += 'No changes.'
            } else {
              body += ['<details>', '<summary>Show plan</summary>', '', '```', plan, '```', '', '</details>'].join('\n')
            }

            // このワークフローのコメントだと分かる目印（画面には表示されない）
            const marker = '<!-- terraform-plan -->'
            body = `${marker}\n${body}`

            // 新しくコメントし、最新の plan をいつも一番下に出す
            const { data: created } = await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            })

            // それより前の plan のコメントを Outdated として折りたたむ（人やほかのコメントには触らない）
            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            for (const c of comments) {
              if (c.id === created.id) continue
              if (c.user?.login !== 'github-actions[bot]') continue
              if (!c.body?.startsWith(marker)) continue
              await github.graphql(
                `mutation($id: ID!) {
                  minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) {
                    minimizedComment { isMinimized }
                  }
                }`,
                { id: c.node_id },
              )
            }
